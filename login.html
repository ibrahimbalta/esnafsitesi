<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Giriş Yap | KolayWebci Admin</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #6366f1;
      --dark: #0f172a;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #fdf2f8 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 44px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 32px;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.08), 0 0 40px rgba(99, 102, 241, 0.08);
      position: relative;
      z-index: 2;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    .logo > span span { color: var(--primary); }
    .logo-svg {
      flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(99, 102, 241, 0.3));
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #0f172a; font-weight: 900; }
    p { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #334155; }
    input {
      width: 100%;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      color: #0f172a;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.25s ease;
    }
    input:focus { outline: none; border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(99, 102, 241, 0.45); }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-container">
    <a href="/" class="logo">
      <img src="/logo-kolaywebci.png" alt="KolayWebci Admin Logo" style="height: 42px; width: auto; object-fit: contain;" />
    </a>
    <h1>Yönetici Girişi</h1>
    <p>Projeyi yönetmek için giriş yapın.</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="username" placeholder="Kullanıcı adınızı girin" required />
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="password" placeholder="Şifrenizi girin" required />
      </div>
      <button type="submit" class="btn-login">Giriş Yap</button>
      <div id="error" class="error-msg">Hatalı kullanıcı adı veya şifre!</div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      
      if (u === 'kolaywebci' && p === '6032.,Elif.') {
        sessionStorage.setItem('isAdmin', 'true');
        window.location.href = '/admin.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
